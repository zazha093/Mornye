name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dart: ${{ steps.final-outputs.outputs.dart }}
      android: ${{ steps.final-outputs.outputs.android }}
      ios: ${{ steps.final-outputs.outputs.ios }}
      rust: ${{ steps.final-outputs.outputs.rust }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            dart:
              - 'third_party/audio_service/**'
              - 'third_party/mornye_discord/**'
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'android/app/src/test/resources/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'l10n.yaml'
              - '.fvmrc'
              - 'scripts/prepare_flutter_sdk.dart'
              - 'patches/flutter/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'rust_backend/**'
              - 'test/fixtures/**'
              - 'android/app/src/test/resources/lyrics_usability_cases.tsv'
              - 'scripts/*rust*.sh'
              - 'android/gradlew'
              - 'android/gradle/wrapper/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'third_party/audio_service/**'
              - 'third_party/mornye_discord/**'
              - 'scripts/setup_discord_sdk.sh'
              - 'scripts/prepare_discord_sdk.py'
              - 'scripts/test_prepare_discord_sdk.py'
              - '.github/actions/discord-sdk/**'
              - 'third_party/discord/*.zip.gpg'
              - 'ios/**'
              - 'scripts/build_ios.sh'
              - 'scripts/flutter_git_commit.sh'
              - 'scripts/test_flutter_git_commit.py'
              - 'scripts/prepare_flutter_sdk.dart'
              - 'patches/flutter/**'
              - 'scripts/check_backend_ios.py'
              - 'scripts/test_check_backend_ios.py'
              - 'lib/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'l10n.yaml'
              - '.fvmrc'
              - '.github/workflows/ci.yml'
            android:
              - 'third_party/audio_service/**'
              - 'third_party/mornye_discord/**'
              - 'scripts/setup_discord_sdk.sh'
              - 'scripts/prepare_discord_sdk.py'
              - 'scripts/test_prepare_discord_sdk.py'
              - '.github/actions/discord-sdk/**'
              - 'third_party/discord/*.zip.gpg'
              - 'android/**'
              - 'rust_backend/**'
              - 'scripts/build_android.sh'
              - 'scripts/flutter_git_commit.sh'
              - 'scripts/test_flutter_git_commit.py'
              - 'scripts/prepare_flutter_sdk.dart'
              - 'patches/flutter/**'
              - 'scripts/build_rust_backend.sh'
              - 'scripts/check_backend_apk.py'
              - 'scripts/test_check_backend_apk.py'
              - 'lib/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'l10n.yaml'
              - '.fvmrc'
              - '.github/workflows/ci.yml'

      - name: Force all outputs on workflow_dispatch or first push
        if: github.event_name == 'workflow_dispatch' || github.event.before == '0000000000000000000000000000000000000000' || (steps.filter.outputs.dart == 'false' && steps.filter.outputs.rust == 'false' && steps.filter.outputs.ios == 'false' && steps.filter.outputs.android == 'false')
        run: "echo \"dart=true\" >> $GITHUB_OUTPUT\necho \"rust=true\" >> $GITHUB_OUTPUT\necho \"ios=true\" >> $GITHUB_OUTPUT\necho \"android=true\" >> $GITHUB_OUTPUT"
        id: force-outputs
      - name: Set final outputs
        if: always()
        run: "DART=\"${{ steps.force-outputs.outputs.dart }}\"\nRUST=\"${{ steps.force-outputs.outputs.rust }}\"\nIOS=\"${{ steps.force-outputs.outputs.ios }}\"\nANDROID=\"${{ steps.force-outputs.outputs.android }}\"\nif [ -z \"$DART\" ]; then DART=\"${{ steps.filter.outputs.dart }}\"; fi\nif [ -z \"$RUST\" ]; then RUST=\"${{ steps.filter.outputs.rust }}\"; fi\nif [ -z \"$IOS\" ]; then IOS=\"${{ steps.filter.outputs.ios }}\"; fi\nif [ -z \"$ANDROID\" ]; then ANDROID=\"${{ steps.filter.outputs.android }}\"; fi\necho \"dart=$DART\" >> $GITHUB_OUTPUT\necho \"rust=$RUST\" >> $GITHUB_OUTPUT\necho \"ios=$IOS\" >> $GITHUB_OUTPUT\necho \"android=$ANDROID\" >> $GITHUB_OUTPUT"
        id: final-outputs
  check-secrets:
    name: Check Discord SDK secret
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_discord_secret: ${{ steps.check.outputs.has_secret }}
    steps:
      - name: Check if Discord SDK passphrase secret is set
        id: check
        run: |
          if [ -n "${{ secrets.DISCORD_MOBILE_SDK_PASSPHRASE }}" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
          fi

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    needs: changes
    if: 'needs.changes.outputs.dart == ''true'''

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test scripts/prepare_flutter_sdk.dart

      - name: Analyze
        run: flutter analyze

      - name: Install media test tools & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
          ffmpeg -version
          ffprobe -version
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99

      - name: Run tests
        run: |
          export DISPLAY=:99
          flutter test

  rust:
    name: Rust checks & Android libraries
    runs-on: ubuntu-latest
    needs: changes
    if: 'needs.changes.outputs.rust == ''true'''

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: cargo-${{ runner.os }}-rust-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-${{ hashFiles('rust_backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-rust-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-

      - name: Install C binding generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      # The Android libraries are built once, by Gradle in the android job.
      - name: Rust formatting, Clippy and unit tests
        run: bash scripts/check_rust_backend.sh

  rust-ios:
    name: Rust iOS libraries & release application
    runs-on: xcode-27
    needs:
      - changes
      - check-secrets
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ios == 'true') && needs.check-secrets.outputs.has_discord_secret == 'true'
    env:
      MORNYE_DISCORD_SDK: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: cargo-${{ runner.os }}-rust-ios-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-${{ hashFiles('rust_backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-rust-ios-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-

      - name: Build iOS device and universal simulator XCFramework
        run: bash scripts/build_rust_backend.sh ios

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Prepare pinned Discord SDK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/discord-sdk
        with:
          passphrase: ${{ secrets.DISCORD_MOBILE_SDK_PASSPHRASE }}

      - name: Configure Rust application pods
        run: |
          flutter pub get
          cd ios
          pod install

      - name: Build and audit Rust iOS release application
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_backend_ios.py'
          python3 -m unittest discover -s scripts -p 'test_flutter_git_commit.py'
          flutter build ios --release --no-codesign --target lib/main.dart
          test -s build/ios/iphoneos/Runner.app/Extensions/LinkNowPlaying.appex/LinkNowPlaying
          if [[ "$MORNYE_DISCORD_SDK" == "1" ]]; then
            test -f build/ios/iphoneos/Runner.app/Frameworks/discord_partner_sdk.framework/discord_partner_sdk
            test -f build/ios/iphoneos/Runner.app/Frameworks/mornye_discord.framework/Discord-License-Notices.txt
          fi
          python3 scripts/check_backend_ios.py build/ios/iphoneos/Runner.app \
            --backend rust --archs arm64 --platform ios --release

  android:
    name: Android Rust builds & native tests
    runs-on: ubuntu-latest
    needs:
      - changes
      - check-secrets
    if: needs.changes.outputs.android == 'true' && needs.check-secrets.outputs.has_discord_secret == 'true'
    env:
      MORNYE_DISCORD_SDK: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.2"
          # Cache public dependencies, not transforms of the decrypted SDK.
          gradle-home-cache-includes: |
            caches/modules-2
            notifications

      - name: Install Android SDK & NDK
        run: |
          # Accept Android SDK licenses
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;4.1.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Test SDK preparation, release selection and APK audits
        run: |
          python3 -m unittest discover -s scripts -p 'test_prepare_discord_sdk.py'
          python3 -m unittest discover -s scripts -p 'test_build_android.py'
          python3 -m unittest discover -s scripts -p 'test_flutter_git_commit.py'
          python3 -m unittest discover -s scripts -p 'test_check_backend_apk.py'

      # Fork PRs cannot access repository secrets and exercise the Lite build.
      - name: Prepare pinned Discord SDK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/discord-sdk
        with:
          passphrase: ${{ secrets.DISCORD_MOBILE_SDK_PASSPHRASE }}

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Configure Flutter SDK for Gradle
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Install Rust application build and media test prerequisites
        run: |
          cd rust_backend
          rustup show
          sudo apt-get update
          sudo apt-get install -y libclang-dev ffmpeg
          ffmpeg -version
          echo "MORNYE_TEST_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: cargo-${{ runner.os }}-android-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-${{ hashFiles('rust_backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-android-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-

      - name: Package Rust application and run native unit tests
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest

      - name: Build Rust release application
        run: |
          if [[ "$MORNYE_DISCORD_SDK" == "1" ]]; then
            bash scripts/build_android.sh --production --target lib/main.dart
          else
            bash scripts/build_android.sh --lite --target lib/main.dart
          fi

      - name: Verify Rust release APK payloads
        run: |
          audit_flags=()
          if [[ "$MORNYE_DISCORD_SDK" == "1" ]]; then
            audit_flags+=(--discord-sdk)
          fi
          python3 scripts/check_backend_apk.py \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --backend rust --abis arm64-v8a "${audit_flags[@]}"
          python3 scripts/check_backend_apk.py \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            --backend rust --abis armeabi-v7a "${audit_flags[@]}"
          # PR builds use Gradle's test key; production signing stays in Release.
          for abi in arm64-v8a armeabi-v7a; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose \
              "build/app/outputs/flutter-apk/app-${abi}-release.apk"
          done

      - name: Record Android symbol provenance
        run: |
          test -s build/symbols/android/app.android-arm64.symbols
          test -s build/symbols/android/app.android-arm.symbols
          test -s build/app/outputs/mapping/release/mapping.txt
          git rev-parse HEAD > build/symbols/android/commit.txt
          sha256sum build/app/outputs/flutter-apk/*release.apk > build/symbols/android/apk-sha256.txt

      - name: Retain Android debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-symbols-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/symbols/android/
            build/app/outputs/mapping/release/mapping.txt
  ci-gate:
    name: CI Gate - Prevent False Green
    runs-on: ubuntu-latest
    needs:
      - changes
      - flutter
      - rust
      - rust-ios
      - android
    if: always()
    steps:
      - name: Check Flutter job status
        id: check-flutter
        run: "FLUTTER_RESULT=\"${{ needs.flutter.result }}\"\necho \"Flutter result: $FLUTTER_RESULT\"\nif [ \"$FLUTTER_RESULT\" = \"skipped\" ]; then echo \"flutter_skipped=true\" >> $GITHUB_OUTPUT; else echo \"flutter_skipped=false\" >> $GITHUB_OUTPUT; fi"
      - name: Check Rust job status
        id: check-rust
        run: "RUST_RESULT=\"${{ needs.rust.result }}\"\necho \"Rust result: $RUST_RESULT\"\nif [ \"$RUST_RESULT\" = \"skipped\" ]; then echo \"rust_skipped=true\" >> $GITHUB_OUTPUT; else echo \"rust_skipped=false\" >> $GITHUB_OUTPUT; fi"
      - name: Check Rust iOS job status
        id: check-rust-ios
        run: "RUST_IOS_RESULT=\"${{ needs.rust-ios.result }}\"\necho \"Rust iOS result: $RUST_IOS_RESULT\"\nif [ \"$RUST_IOS_RESULT\" = \"skipped\" ]; then echo \"rust_ios_skipped=true\" >> $GITHUB_OUTPUT; else echo \"rust_ios_skipped=false\" >> $GITHUB_OUTPUT; fi"
      - name: Check Android job status
        id: check-android
        run: "ANDROID_RESULT=\"${{ needs.android.result }}\"\necho \"Android result: $ANDROID_RESULT\"\nif [ \"$ANDROID_RESULT\" = \"skipped\" ]; then echo \"android_skipped=true\" >> $GITHUB_OUTPUT; else echo \"android_skipped=false\" >> $GITHUB_OUTPUT; fi"
      - name: Fail if Flutter skipped when should run
        if: steps.check-flutter.outputs.flutter_skipped == 'true' && needs.changes.outputs.dart == 'true'
        run: "echo \"::error::Flutter analyze & test was skipped but should have run (dart changes detected)\"\nexit 1"
      - name: Fail if Rust skipped when should run
        if: steps.check-rust.outputs.rust_skipped == 'true' && needs.changes.outputs.rust == 'true'
        run: "echo \"::error::Rust checks & Android libraries was skipped but should have run (rust changes detected)\"\nexit 1"
      - name: Fail if Rust iOS skipped when should run
        if: steps.check-rust-ios.outputs.rust_ios_skipped == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ios == 'true') && needs.check-secrets.outputs.has_discord_secret == 'true'
        run: "echo \"::error::Rust iOS libraries & release application was skipped but should have run (rust/ios changes detected and secret available)\"\nexit 1"
      - name: Fail if Android skipped when should run
        if: steps.check-android.outputs.android_skipped == 'true' && needs.changes.outputs.android == 'true' && needs.check-secrets.outputs.has_discord_secret == 'true'
        run: "echo \"::error::Android Rust builds & native tests was skipped but should have run (android changes detected and secret available)\"\nexit 1"
  l10n-check:
    name: Thai Localization Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/add-thai-locale' || github.head_ref == 'feat/add-thai-locale'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze
      - name: Run locale-related tests
        run: flutter test --reporter=github --plain-name "locale|l10n|arb|localization|translation|thai|Thai" || true
